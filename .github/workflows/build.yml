name: Build and publish

# Web version on GitHub Pages (hazz25.github.io/NextStopLondon), Android version as
# NextStopLondon.apk in the latest release.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      # GitHub sometimes needs a moment before the uploaded site can be published.
      - run: sleep 15
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decrypt signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Le secret SIGNING_KEY est manquant (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 \
            -in keystore/nextstop.jks.enc -out keystore/nextstop.jks -pass env:SIGNING_KEY

      - name: Build
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: gradle :android:assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Check and rename
        run: |
          cp android/build/outputs/apk/release/android-release.apk NextStopLondon.apk
          rm -f keystore/nextstop.jks
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify NextStopLondon.apk

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" NextStopLondon.apk \
            --title "Next Stop: London 1.0.${{ github.run_number }}" \
            --notes "Version 1.0.${{ github.run_number }}. Téléchargez NextStopLondon.apk sur votre téléphone Android et installez-le." \
            --latest
